name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check .
      - name: Tests
        run: uv run --python 3.12 --group dev pytest -q
      # Eval gate: screens all 20,000 synthetic customers and fails the build if recall
      # at the threshold in src/kycscreen/config/screening.yaml drops below target_recall.
      - name: Recall gate
        run: uv run --python 3.12 kycscreen eval --gate

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kycscreen:ci
      - name: Smoke test the container
        run: |
          docker run -d --name kyc -p 8000:8000 kycscreen:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs localhost:8000/healthz
          curl -fs -X POST localhost:8000/screen/person -H 'content-type: application/json' -d '{"name":"Mohamed Haddad"}'
          docker rm -f kyc
